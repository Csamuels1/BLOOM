appId: host.exp.Exponent
name: BLOOM iOS auth
# Exercises the unauthenticated surface: the sign-in entry, navigation to
# registration, and the 18+ eligibility gate blocking account creation. A full
# verified sign-up is not driven here (it needs a seeded account and a mailbox);
# authenticated-area E2E is carried in the Phase 13 iOS gate (#58).
---
- openLink: exp://127.0.0.1:8081
- tapOn:
    text: Open
    optional: true
# Expo Go shows a one-time "developer menu" sheet over the app once the bundle
# loads, which hides the sign-in screen. Wait until either the sheet or the app
# is on screen, then dismiss the sheet if present (found on the first iOS run).
- extendedWaitUntil:
    visible:
      text: 'Continue|Welcome back. Take your time.'
    timeout: 120000
- tapOn:
    text: Continue
    optional: true
- tapOn:
    text: Close
    optional: true
# Signed out, the app lands on sign-in.
- extendedWaitUntil:
    visible: Welcome back. Take your time.
    timeout: 30000
- assertVisible: Sign in
# A deep link to a protected route must not reach it while signed out.
- openLink: exp://127.0.0.1:8081/--/foundation
- extendedWaitUntil:
    visible: Sign in
    timeout: 30000
- assertNotVisible: A gentle beginning
# Go to registration.
# Screens now animate in (#149): wait for each to settle before asserting.
- tapOn: Create an account
- extendedWaitUntil:
    visible: Create your account
    timeout: 15000
- assertVisible: I confirm I am 18 or older.
# Attempt to create without confirming 18+ — creation is blocked with a notice.
- tapOn:
    id: email
    optional: true
- tapOn: Create account
- assertVisible: Please confirm you are 18 or older to continue.
# A failed submit focuses the first invalid field (#146), which opens the
# keyboard. On a fresh simulator, iOS first shows a one-time "slide to type"
# tip with a Continue button over the bottom of the screen. Dismiss both.
- tapOn:
    text: Continue
    optional: true
- hideKeyboard
# Return to sign-in.
- scrollUntilVisible:
    element:
      text: Already have an account? Sign in
    direction: DOWN
    timeout: 15000
- tapOn: Already have an account? Sign in
- extendedWaitUntil:
    visible: Welcome back. Take your time.
    timeout: 15000
