name: Repository checks

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  repository-policy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Verify required foundation files
        shell: bash
        run: |
          set -euo pipefail
          required=(
            AGENTS.md
            CHANGELOG.md
            CONTRIBUTING.md
            README.md
            SECURITY.md
            docs/BUILD_STATUS.md
            docs/BRAND_AND_COPY.md
            docs/DEFINITION_OF_DONE.md
            docs/ENVIRONMENTS_AND_SECRETS.md
            docs/PRODUCT_BRIEF.md
            docs/PROJECT_PLAN.md
            docs/SECURITY_BASELINE.md
          )
          for file in "${required[@]}"; do
            test -s "$file" || { echo "Missing or empty required file: $file"; exit 1; }
          done

      - name: Reject tracked secret files
        shell: bash
        run: |
          set -euo pipefail
          if git ls-files | grep -E '(^|/)\.env($|\.)' | grep -v -E '(^|/)\.env\.example$'; then
            echo "Tracked environment file detected"
            exit 1
          fi

      - name: Reject merge-conflict markers
        shell: bash
        run: |
          set -euo pipefail
          if git grep -n -E '^(<<<<<<<|=======|>>>>>>>)' -- ':!*.lock'; then
            echo "Merge-conflict marker detected"
            exit 1
          fi

      - name: Validate Markdown links
        uses: lycheeverse/lychee-action@v2
        with:
          args: >-
            --no-progress
            --exclude '^https://github.com/Csamuels1/BLOOM/security/advisories/new$'
            './**/*.md'
          fail: true
