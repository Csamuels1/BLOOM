name: iOS simulator smoke

on:
  # Restored in Phase 13 (#58, ADR-0006). Non-blocking: not a required check
  # while hosted macOS capacity is unreliable. The owner decides when to require it.
  pull_request:
    paths:
      - 'src/**'
      - 'assets/**'
      - '.maestro/**'
      - 'app.json'
      - 'package.json'
      - 'package-lock.json'
      - 'scripts/select-ios-simulator.cjs'
      - '.github/workflows/ios-smoke.yml'
  workflow_dispatch:
    inputs:
      runner:
        # macOS arm64 hosted capacity was often exhausted ("job was not acquired"),
        # so Intel (a separate pool, first green run 45443558807) is the default.
        description: macOS runner image
        type: choice
        default: macos-15-intel
        options:
          - macos-15-intel
          - macos-15

permissions:
  contents: read

concurrency:
  group: ios-smoke-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ios-smoke:
    # Standard runner minutes are free for this public repo. Reassess if private.
    if: github.event.repository.private == false
    runs-on: ${{ inputs.runner || 'macos-15-intel' }}
    # Intel simulators build and boot more slowly than arm64.
    timeout-minutes: ${{ inputs.runner == 'macos-15' && 30 || 60 }}
    env:
      CI: '1'
      EXPO_NO_TELEMETRY: '1'
      NODE_OPTIONS: --dns-result-order=ipv4first
      MAESTRO_CLI_NO_ANALYTICS: 'true'
      # Allow up to five minutes for XCTest startup on the hosted simulator.
      MAESTRO_DRIVER_STARTUP_TIMEOUT: '300000'
      # Public, non-secret PLACEHOLDER config so the app can boot (the auth
      # client reads these at startup). The smoke test exercises only the
      # signed-out surface, which never reaches the network.
      EXPO_PUBLIC_APP_ENV: local
      EXPO_PUBLIC_SUPABASE_URL: https://ci-placeholder.supabase.co
      EXPO_PUBLIC_SUPABASE_PUBLISHABLE_KEY: ci-placeholder-publishable-key
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - run: npm install --global npm@11.9.0
      - run: npm ci
      - name: Install pinned Maestro with checksum verification
        shell: bash
        run: |
          set -euo pipefail
          curl --fail --location --retry 3 \
            https://github.com/mobile-dev-inc/Maestro/releases/download/cli-2.11.0/maestro.zip \
            --output "$RUNNER_TEMP/maestro.zip"
          echo "5384593cb4e7a106489e75a821d157dd43f4e438df6bc308b72e82c685e1283a  $RUNNER_TEMP/maestro.zip" | shasum -a 256 --check
          unzip -q "$RUNNER_TEMP/maestro.zip" -d "$RUNNER_TEMP/bloom-maestro"
          echo "$RUNNER_TEMP/bloom-maestro/maestro/bin" >> "$GITHUB_PATH"
      - name: Boot an available iPhone simulator
        timeout-minutes: 12
        shell: bash
        run: |
          set -euo pipefail
          device=$(xcrun simctl list devices available --json | node scripts/select-ios-simulator.cjs)
          echo "BLOOM_IOS_DEVICE=$device" >> "$GITHUB_ENV"
          xcrun simctl boot "$device"
          xcrun simctl bootstatus "$device" -b
      # Metro runs WITHOUT `--ios` (#161). With `--ios`, the Expo CLI also runs
      # `xcrun simctl openurl`, which sometimes times out on the hosted
      # simulator (NSPOSIXErrorDomain code 60); the CLI then exits and takes
      # Metro with it, so the run failed before any test. Installing and opening
      # Expo Go are now separate steps that can never stop Metro.
      - name: Start Metro
        timeout-minutes: 15
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p test-results/ios
          npm run start -- --go --localhost --port 8081 --max-workers 2 > test-results/ios/metro.log 2>&1 &
          echo "$!" > test-results/ios/metro.pid
          for attempt in {1..120}; do
            if curl --fail --silent http://127.0.0.1:8081/status | grep -q 'packager-status:running'; then
              exit 0
            fi
            sleep 3
          done
          cat test-results/ios/metro.log
          echo "::error::Infrastructure: Metro did not start on port 8081"
          exit 1
      # This does what `expo start --ios` did internally (@expo/cli
      # ExpoGoInstaller / downloadExpoGoAsync): look up the project SDK's
      # `iosClientUrl` in Expo's versions API, extract the simulator build and
      # install it. It keeps the SDK-compatible guarantee (the SDK comes from the
      # installed `expo` package, exactly as the CLI derives it) without coupling
      # the install to Metro's process, and curl retries cover transient network
      # errors. Calling the CLI's internal build modules instead would break
      # silently on a CLI upgrade, and running `expo start --ios` only to install
      # would still hit the same openurl timeout and race Metro for port 8081.
      - name: Install SDK-compatible Expo Go
        timeout-minutes: 10
        shell: bash
        run: |
          set -euo pipefail
          fail() {
            echo "::error::Infrastructure: Expo Go could not be installed on the simulator ($1)"
            exit 1
          }
          sdk_version="$(node -p "require('expo/package.json').version.split('.')[0] + '.0.0'")"
          curl --fail --silent --show-error --location --retry 3 --retry-all-errors \
            https://api.expo.dev/v2/versions/latest --output "$RUNNER_TEMP/expo-versions.json" ||
            fail "versions API unavailable"
          read -r client_url client_version < <(node -e '
            const sdk = JSON.parse(require("fs").readFileSync(process.argv[1], "utf8")).data.sdkVersions[process.argv[2]];
            if (!sdk || !sdk.iosClientUrl) process.exit(1);
            console.log(sdk.iosClientUrl, sdk.iosClientVersion || "unknown");
          ' "$RUNNER_TEMP/expo-versions.json" "$sdk_version") || fail "no Expo Go build listed for SDK $sdk_version"
          echo "Installing Expo Go $client_version for SDK $sdk_version from $client_url"
          curl --fail --silent --show-error --location --retry 3 --retry-all-errors \
            "$client_url" --output "$RUNNER_TEMP/expo-go.tar.gz" || fail "download failed"
          app_dir="$RUNNER_TEMP/Expo-Go.app"
          mkdir -p "$app_dir"
          tar -xzf "$RUNNER_TEMP/expo-go.tar.gz" -C "$app_dir" || fail "archive could not be extracted"
          xcrun simctl install "$BLOOM_IOS_DEVICE" "$app_dir" || fail "simctl install failed"
          xcrun simctl get_app_container "$BLOOM_IOS_DEVICE" host.exp.Exponent app >/dev/null ||
            fail "app not found after install"
          echo "Installed Expo Go $(/usr/libexec/PlistBuddy -c 'Print :CFBundleShortVersionString' "$app_dir/Info.plist" 2>/dev/null || echo unknown)."
      # The first iOS bundle takes minutes to build on a hosted runner (about
      # 200s for roughly 2,200 modules), longer than Expo Go waits for it, which
      # surfaces as "Could not connect to development server". Build it once
      # here so Metro serves the test's request from its cache.
      - name: Pre-warm the iOS JavaScript bundle
        timeout-minutes: 15
        shell: bash
        run: |
          set -uo pipefail
          curl --fail --silent --show-error --max-time 840 --output /dev/null \
            'http://127.0.0.1:8081/node_modules/expo-router/entry.bundle?platform=ios&dev=true&hot=false&lazy=true&transform.engine=hermes&transform.bytecode=1&transform.routerRoot=src%2Fapp&unstable_transformProfile=hermes-stable'
          status=$?
          if test "$status" -eq 0; then
            echo "iOS bundle built and cached."
            exit 0
          fi
          tail -n 80 test-results/ios/metro.log || true
          if test "$status" -eq 22; then
            echo "::error::Metro returned an error building the iOS bundle (an app bundling problem); see metro.log"
          else
            echo "::error::Infrastructure: Metro stopped or did not answer (curl exit $status); see metro.log"
          fi
          exit 1
      # Open the project in Expo Go before Maestro, as `expo start --ios` used
      # to, so the test starts from the same state. Each attempt is capped (perl
      # alarm; macOS has no `timeout`) and retried with backoff. Metro is a
      # separate process, so a failed open can no longer stop it. If the URL
      # never opens but Expo Go launches, Maestro's own `openLink` still loads
      # the project; if Expo Go never launches, fail as infrastructure.
      - name: Open the project in Expo Go
        timeout-minutes: 8
        shell: bash
        run: |
          set -uo pipefail
          for attempt in 1 2 3; do
            if perl -e 'alarm shift; exec @ARGV' 90 \
              xcrun simctl openurl "$BLOOM_IOS_DEVICE" exp://127.0.0.1:8081; then
              echo "Opened exp://127.0.0.1:8081 in Expo Go (attempt $attempt)."
              exit 0
            fi
            echo "::warning::simctl openurl attempt $attempt failed; retrying"
            sleep $((attempt * 15))
          done
          if perl -e 'alarm shift; exec @ARGV' 90 \
            xcrun simctl launch "$BLOOM_IOS_DEVICE" host.exp.Exponent; then
            echo "::warning::The URL did not open, but Expo Go launched; Maestro's openLink will load the project."
            exit 0
          fi
          echo "::error::Infrastructure: Expo Go could not be opened on the simulator (the app never launched; not an app or test failure)"
          exit 1
      - name: Run signed-out auth smoke test (sign-in, deep-link guard, 18+ gate)
        timeout-minutes: 10
        run: maestro --device "$BLOOM_IOS_DEVICE" test --debug-output test-results/ios/maestro --format junit --output test-results/ios/results.xml .maestro/ios-auth.yml
      - name: Report whether Metro was still running
        if: failure()
        shell: bash
        run: |
          if curl --fail --silent --max-time 10 http://127.0.0.1:8081/status | grep -q 'packager-status:running'; then
            echo "Metro is still running; a failure above is in the app, the test, or the simulator."
          else
            echo "::error::Infrastructure: Metro is not running; see test-results/ios/metro.log"
          fi
      - name: Record simulator toolchain diagnostics
        if: always()
        run: |
          mkdir -p test-results/ios
          xcodebuild -version > test-results/ios/xcode-version.txt
          xcrun simctl list devices booted --json > test-results/ios/booted-devices.json
          xcrun simctl list runtimes --json > test-results/ios/runtimes.json
      - name: Collect diagnostic screenshot
        if: always() && env.BLOOM_IOS_DEVICE != ''
        run: |
          mkdir -p test-results/ios
          xcrun simctl io "$BLOOM_IOS_DEVICE" screenshot test-results/ios/final-screen.png
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ios-smoke-evidence
          path: test-results/ios/
          retention-days: 1
      - name: Stop test resources
        if: always()
        shell: bash
        run: |
          if test -f test-results/ios/metro.pid; then
            kill "$(cat test-results/ios/metro.pid)" || true
          fi
          if test -n "${BLOOM_IOS_DEVICE:-}"; then
            xcrun simctl shutdown "$BLOOM_IOS_DEVICE" || true
          fi
